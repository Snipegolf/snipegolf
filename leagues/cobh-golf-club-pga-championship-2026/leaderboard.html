<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0a">
  <title>Leaderboard · Cobh Golf Club — PGA Championship 2026 | SnipeGolf</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .sg-status{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);font-size:.82rem;color:var(--muted)}
    .sg-status.ok{background:rgba(46,204,113,.12);border-color:rgba(46,204,113,.3);color:#7be2a7}
    .sg-status.warn{background:rgba(243,156,18,.12);border-color:rgba(243,156,18,.3);color:#f4c97a}
    .sg-status.err{background:rgba(231,76,60,.12);border-color:rgba(231,76,60,.3);color:#f7a5a0}
    .sg-dot{width:8px;height:8px;border-radius:50%;background:#7be2a7;box-shadow:0 0 0 0 rgba(123,226,167,.6);animation:sgpulse 1.8s infinite}
    @keyframes sgpulse{0%{box-shadow:0 0 0 0 rgba(123,226,167,.6)}70%{box-shadow:0 0 0 8px rgba(123,226,167,0)}100%{box-shadow:0 0 0 0 rgba(123,226,167,0)}}
    .refresh-bar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:var(--s-4);flex-wrap:wrap}
    .lb .col-score.neg{color:#7be2a7}
    .lb .col-score.pos{color:#f7a5a0}
    .lb .col-score.even{color:var(--text)}
    .lb .picks-line{font-size:.78rem;color:var(--muted);margin-top:6px;line-height:1.55}
    .lb .picks-line .cut{color:#666;text-decoration:line-through}
    .lb .picks-line .pick-name{color:var(--text-2,#cfd6e0)}
    .lb .tb-line{font-size:.72rem;color:#6c7787;margin-top:4px}
    .lb tr.top1{background:linear-gradient(90deg,rgba(212,175,55,.10),transparent)}
    .lb tr.top2{background:linear-gradient(90deg,rgba(192,192,192,.08),transparent)}
    .lb tr.top3{background:linear-gradient(90deg,rgba(205,127,50,.10),transparent)}
    .lb .rank-medal{display:inline-block;width:24px;height:24px;line-height:24px;border-radius:50%;text-align:center;font-size:.78rem;font-weight:800}
    .lb .rank-medal.m1{background:#d4af37;color:#1a1a1a}
    .lb .rank-medal.m2{background:#c0c0c0;color:#1a1a1a}
    .lb .rank-medal.m3{background:#cd7f32;color:#1a1a1a}
    .sg-empty{padding:48px 20px;text-align:center;color:var(--muted)}
    .pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:.7rem;font-weight:600;background:rgba(255,255,255,.08);color:var(--muted);margin-left:8px}
  </style>
</head>
<body data-page="leaderboard">

  <header class="site-header" role="banner">
    <div class="site-header__inner">
      <a class="brand" href="../../index.html" aria-label="SnipeGolf home">
        <span class="brand__mark" aria-hidden="true">S</span>
        <span class="serif">SNIPEGOLF</span>
      </a>
      <nav class="site-nav" aria-label="Primary">
        <a href="pga-scores.html" title="PGA Tour live scores (ESPN)">PGA live scores</a>
      </nav>
    </div>
  </header>

  <div class="league-header">
    <div class="league-header__row">
      <div class="league-logos">
        <img src="https://res.cloudinary.com/pgatour-prod/d_tournaments:logos:r000.png/tournaments/logos/r033.png" alt="Cobh Golf Club" onerror="this.style.display='none'">
        <span class="league-logos__divider" aria-hidden="true"></span>
      </div>
      <div class="league-title">
        <span>PGA Championship 2026</span>
        <small>Cobh Golf Club · Aronimink · Par 70</small>
      </div>
    </div>
  </div>

  <main>
    <section class="section">
      <div class="container">

        <nav class="tab-nav" aria-label="League sections">
          <a href="index.html">Home</a>
          <a href="leaderboard.html" class="active">Leaderboard</a>
          <a href="https://script.google.com/macros/s/AKfycbzf26drG5RAVZTBIOVzOJbK7yyNOHZvvi6iaTOq0lre50coQR5sCztY3xBDj4CQDJl9mw/exec?league=cobh-golf-club-pga-championship-2026&amp;mode=picks">Enter picks</a>
          <a href="field.html">Field</a>
          <a href="qr.html">QR poster</a>
        </nav>

        <div class="refresh-bar">
          <h2 class="serif" style="margin:0">Leaderboard</h2>
          <span id="sg-status" class="sg-status"><span class="sg-dot"></span>Loading…</span>
        </div>

        <div class="card mb-6" style="padding:0;overflow:hidden">
          <div class="lb-wrap">
            <table class="lb" id="sg-table" aria-live="polite">
              <thead>
                <tr>
                  <th class="col-rank">#</th>
                  <th class="col-name">Entry</th>
                  <th class="col-score" style="text-align:right;padding-right:16px">Total</th>
                </tr>
              </thead>
              <tbody id="sg-body">
                <tr><td colspan="3"><div class="sg-empty">Loading entries…</div></td></tr>
              </tbody>
            </table>
          </div>
        </div>

        <p style="font-size:.78rem;color:var(--muted);text-align:center;margin-top:var(--s-3)">
          Auto-refresh every 90 seconds · Live data from ESPN · Scoring: missed cut / WD / DQ = current score +5
        </p>

      </div>
    </section>
  </main>

<script>
(function(){
  var ESPN_URL = 'https://site.api.espn.com/apis/site/v2/sports/golf/leaderboard?event=401811947';
  var PICKS_CSV = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSspURQcmIsWDqRciouecPQ61cQXED09XszJopzbyyNmgBxojHAMxwr-tzfeFVj-ZuRKKx1RyACe_PZ/pub?gid=922314092&single=true&output=csv';
  var REFRESH_MS = 90 * 1000;

  var MC_PENALTY = 5, WD_PENALTY = 5, DQ_PENALTY = 5, NOSHOW_PENALTY = 5;

  var NAME_ALIASES = {
    'matthew fitzpatrick': 'matt fitzpatrick',
    'daniel brown': 'dan brown'
  };

  var statusEl = document.getElementById('sg-status');
  var bodyEl = document.getElementById('sg-body');

  function normName(n){
    var s = String(n||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
    if (NAME_ALIASES[s]) return NAME_ALIASES[s];
    return s;
  }
  function fmt(s){
    if (s===null||s===undefined) return '—';
    if (s===0) return 'E';
    if (s>0) return '+'+s;
    return String(s);
  }
  function scoreClass(s){ if (s===0) return 'even'; if (s<0) return 'neg'; return 'pos'; }
  function escapeHtml(s){ return String(s||'').replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }

  function parseCSV(text){
    var rows=[], cur='', row=[], inQ=false;
    for (var i=0;i<text.length;i++){
      var c=text[i];
      if (inQ){
        if (c==='"' && text[i+1]==='"'){ cur+='"'; i++; }
        else if (c==='"'){ inQ=false; }
        else cur+=c;
      } else {
        if (c==='"') inQ=true;
        else if (c===','){ row.push(cur); cur=''; }
        else if (c==='\n'){ row.push(cur); rows.push(row); row=[]; cur=''; }
        else if (c==='\r'){} else cur+=c;
      }
    }
    if (cur.length||row.length){ row.push(cur); rows.push(row); }
    return rows;
  }

  function buildScoreMap(espn){
    var map={};
    try {
      var comp=espn.events[0].competitions[0];
      var competitors=comp.competitors||[];
      for (var i=0;i<competitors.length;i++){
        var p=competitors[i];
        var name=p.athlete?p.athlete.displayName:'';
        if (!name) continue;
        var status=(p.status&&p.status.type&&p.status.type.name)||'';
        var statusDesc=(p.status&&p.status.type&&p.status.type.description)||'';
        var sLower=(status+' '+statusDesc).toLowerCase();
        var sv=null;
        if (p.statistics){
          for (var j=0;j<p.statistics.length;j++){
            var nm=p.statistics[j].name;
            if (nm==='scoreToPar'||nm==='toPar'){ sv=parseInt(p.statistics[j].value,10); break; }
          }
        }
        if (sv===null && p.score!==undefined){
          var raw=String(p.score).trim().replace('E','0').replace('+','');
          var n=parseInt(raw,10);
          if (!isNaN(n)) sv=n;
        }
        var cut=false;
        var base=sv!==null?sv:0;
        if (sLower.indexOf('cut')>=0){ sv=base+MC_PENALTY; cut=true; }
        else if (sLower.indexOf('withdraw')>=0||sLower.indexOf(' wd')>=0||sLower==='wd'){ sv=base+WD_PENALTY; cut=true; }
        else if (sLower.indexOf('disqual')>=0||sLower==='dq'){ sv=base+DQ_PENALTY; cut=true; }
        map[normName(name)]={name:name,score:sv!==null?sv:0,cut:cut,status:statusDesc||status};
      }
    } catch(e){ console.error('ESPN parse',e); }
    return map;
  }

  function leaderScore(map){
    var min=999;
    for (var k in map){ if (!map[k].cut && map[k].score<min) min=map[k].score; }
    return min===999?0:min;
  }

  function setStatus(msg, cls){
    statusEl.className = 'sg-status ' + (cls||'');
    statusEl.innerHTML = (cls==='ok' ? '<span class="sg-dot"></span>' : '') + escapeHtml(msg);
  }

  function render(rows, espnStatus){
    if (!rows.length){
      bodyEl.innerHTML = '<tr><td colspan="3"><div class="sg-empty">No entries yet.</div></td></tr>';
      return;
    }
    var html='';
    for (var i=0;i<rows.length;i++){
      var r=rows[i];
      var cls=''; if(i===0)cls='top1'; else if(i===1)cls='top2'; else if(i===2)cls='top3';
      var rankCell;
      if (i===0) rankCell='<span class="rank-medal m1">1</span>';
      else if (i===1) rankCell='<span class="rank-medal m2">2</span>';
      else if (i===2) rankCell='<span class="rank-medal m3">3</span>';
      else rankCell=String(i+1);
      var bits=[];
      for (var k=0;k<r.detail.length;k++){
        var d=r.detail[k];
        var c=d.cut?' class="cut"':' class="pick-name"';
        bits.push('<span'+c+'>'+escapeHtml(d.name)+' '+fmt(d.score)+'</span>');
      }
      html += '<tr class="'+cls+'">';
      html += '<td class="col-rank">'+rankCell+'</td>';
      html += '<td class="col-name"><strong>'+escapeHtml(r.name)+'</strong>';
      html += '<div class="picks-line">'+bits.join(' · ')+'</div>';
      if (r.tiebreaker) html += '<div class="tb-line">Tiebreaker guess: '+fmt(r.tiebreaker)+'</div>';
      html += '</td>';
      html += '<td class="col-score '+scoreClass(r.total)+'" style="text-align:right;padding-right:16px;font-size:1.05rem">'+fmt(r.total)+'</td>';
      html += '</tr>';
    }
    bodyEl.innerHTML = html;
    var now = new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
    setStatus('Live · '+espnStatus+' · '+rows.length+' entries · '+now, 'ok');
  }

  function refresh(){
    setStatus('Refreshing…','');
    Promise.all([
      fetch(ESPN_URL,{cache:'no-store'}).then(function(r){return r.json();}),
      fetch(PICKS_CSV+'&cb='+Date.now(),{cache:'no-store'}).then(function(r){return r.text();})
    ]).then(function(results){
      var espn=results[0], csv=results[1];
      var scoreMap=buildScoreMap(espn);
      var lead=leaderScore(scoreMap);
      var espnStatus='Live';
      try { espnStatus=espn.events[0].status.type.description; } catch(e){}

      var csvRows=parseCSV(csv);
      var entries=[];
      for (var i=0;i<csvRows.length;i++){
        var row=csvRows[i];
        if (!row||row.length<13) continue;
        var name=row[1];
        if (!name||/^name$/i.test(name)) continue;
        var picks=[row[4],row[5],row[6],row[7],row[8],row[9],row[10],row[11]];
        var tb=parseInt(row[12],10); if (isNaN(tb)) tb=0;
        entries.push({name:name,picks:picks,tiebreaker:tb});
      }

      var rows=[];
      for (var ei=0;ei<entries.length;ei++){
        var e=entries[ei];
        var total=0, detail=[];
        for (var pi=0;pi<e.picks.length;pi++){
          var key=normName(e.picks[pi]);
          var info=scoreMap[key];
          if (info){ total+=info.score; detail.push({name:info.name,score:info.score,cut:info.cut}); }
          else if (e.picks[pi]){ total+=NOSHOW_PENALTY; detail.push({name:e.picks[pi],score:NOSHOW_PENALTY,cut:true}); }
        }
        rows.push({name:e.name,total:total,detail:detail,tiebreaker:e.tiebreaker});
      }

      rows.sort(function(a,b){
        if (a.total!==b.total) return a.total-b.total;
        return Math.abs((a.tiebreaker||0)-lead) - Math.abs((b.tiebreaker||0)-lead);
      });

      render(rows,espnStatus);
    }).catch(function(err){
      console.error(err);
      setStatus('Fetch failed — retrying in 90s','err');
    });
  }

  refresh();
  setInterval(refresh,REFRESH_MS);
})();
</script>
</body>
</html>
