<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SnipeGolf · Cobh PGA 2026 · Live Leaderboard</title>
<style>
  *{box-sizing:border-box}
  body{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;margin:0;padding:0;background:#0a3d2e;color:#fff}
  header{padding:16px;background:#062920;text-align:center;border-bottom:3px solid #c9a14a}
  header h1{margin:0;font-size:18px;letter-spacing:.5px}
  header .sub{font-size:12px;opacity:.8;margin-top:4px}
  #sg-live-status{padding:10px 14px;font-size:13px;text-align:center;background:#1a5a45}
  #sg-live-status.ok{background:#1a7a55}
  #sg-live-status.warn{background:#a07a1a}
  #sg-live-status.err{background:#a01a1a}
  main{padding:8px;max-width:900px;margin:0 auto}
  table{width:100%;border-collapse:collapse;background:#fff;color:#222;border-radius:8px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.3)}
  th,td{padding:10px 8px;text-align:left;border-bottom:1px solid #eee;font-size:14px}
  th{background:#0a3d2e;color:#fff;font-weight:600;font-size:12px;letter-spacing:.5px;text-transform:uppercase}
  tr.top1{background:#fff8dc}
  tr.top2{background:#f0f0f0}
  tr.top3{background:#ffe8d0}
  .rank{font-weight:700;width:36px;text-align:center}
  .score{font-variant-numeric:tabular-nums;font-weight:700;font-size:16px;width:60px;text-align:right;padding-right:14px}
  .name{font-weight:600}
  .picks{font-size:11px;color:#666;line-height:1.5;margin-top:3px}
  .cut{color:#aaa;text-decoration:line-through}
  .neg{color:#c0392b}
  .pos{color:#666}
  .even{color:#000}
  .tb{font-size:10px;color:#999;margin-top:2px}
  footer{padding:14px;text-align:center;font-size:11px;opacity:.7}
  @media(max-width:600px){
    .score{font-size:14px}
    th,td{padding:8px 4px;font-size:13px}
    .picks{font-size:10px}
  }
</style>
</head>
<body>
<header>
  <h1>🏌️ Cobh Golf Club · PGA Championship 2026</h1>
  <div class="sub">Live Leaderboard · Aronimink · Par 70</div>
</header>
<div id="sg-live-status">Loading live scores...</div>
<main>
  <div id="sg-live-leaderboard"></div>
</main>
<footer>SnipeGolf · Powered by ESPN live data · Auto-refresh every 90 sec</footer>

<script>
(function(){
  var ESPN_URL = 'https://site.api.espn.com/apis/site/v2/sports/golf/leaderboard?event=401811947';
  var PICKS_CSV = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSspURQcmIsWDqRciouecPQ61cQXED09XszJopzbyyNmgBxojHAMxwr-tzfeFVj-ZuRKKx1RyACe_PZ/pub?gid=922314092&single=true&output=csv';
  var REFRESH_MS = 90 * 1000;
  var statusEl = document.getElementById('sg-live-status');
  var tableEl = document.getElementById('sg-live-leaderboard');

  var PAR = 70;
  // Additive penalty — added ON TOP of player's score at the time they were cut/WD/DQ
  // Example: player at +3 misses cut -> pick score = 3 + 5 = +8
  var MC_PENALTY = 5;
  var WD_PENALTY = 5;
  var DQ_PENALTY = 5;
  var NOSHOW_PENALTY = 5; // player not in ESPN field at all

  function normName(n){
    return String(n||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
  }

  function fmt(s){
    if (s===null||s===undefined) return '-';
    if (s===0) return 'E';
    if (s>0) return '+'+s;
    return String(s);
  }
  function scoreClass(s){
    if (s===0) return 'even';
    if (s<0) return 'neg';
    return 'pos';
  }

  function parseCSV(text){
    // Handles quoted fields with commas, returns array of arrays
    var rows = [];
    var cur = '';
    var row = [];
    var inQ = false;
    for (var i=0;i<text.length;i++){
      var c = text[i];
      if (inQ){
        if (c === '"' && text[i+1] === '"'){ cur += '"'; i++; }
        else if (c === '"'){ inQ = false; }
        else { cur += c; }
      } else {
        if (c === '"'){ inQ = true; }
        else if (c === ','){ row.push(cur); cur = ''; }
        else if (c === '\n'){ row.push(cur); rows.push(row); row=[]; cur=''; }
        else if (c === '\r'){ /* skip */ }
        else { cur += c; }
      }
    }
    if (cur.length || row.length){ row.push(cur); rows.push(row); }
    return rows;
  }

  function buildScoreMap(espn){
    var map = {};
    try {
      var comp = espn.events[0].competitions[0];
      var competitors = comp.competitors || [];
      for (var i=0;i<competitors.length;i++){
        var p = competitors[i];
        var name = p.athlete ? p.athlete.displayName : '';
        if (!name) continue;
        var status = (p.status && p.status.type && p.status.type.name) || '';
        var statusDesc = (p.status && p.status.type && p.status.type.description) || '';
        var sLower = (status + ' ' + statusDesc).toLowerCase();

        var sv = null;
        if (p.statistics){
          for (var j=0;j<p.statistics.length;j++){
            var nm = p.statistics[j].name;
            if (nm === 'scoreToPar' || nm === 'toPar'){
              sv = parseInt(p.statistics[j].value,10);
              break;
            }
          }
        }
        if (sv === null && p.score !== undefined){
          var raw = String(p.score).trim().replace('E','0').replace('+','');
          var n = parseInt(raw,10);
          if (!isNaN(n)) sv = n;
        }

        var cut = false;
        var baseScore = sv !== null ? sv : 0;
        if (sLower.indexOf('cut') >= 0){ sv = baseScore + MC_PENALTY; cut = true; }
        else if (sLower.indexOf('withdraw') >= 0 || sLower.indexOf(' wd') >= 0 || sLower === 'wd'){ sv = baseScore + WD_PENALTY; cut = true; }
        else if (sLower.indexOf('disqual') >= 0 || sLower === 'dq'){ sv = baseScore + DQ_PENALTY; cut = true; }

        map[normName(name)] = { name: name, score: sv!==null?sv:0, cut: cut, status: status };
      }
    } catch(e){ console.error('ESPN parse', e); }
    return map;
  }

  function leaderScoreFromMap(map){
    var min = 999;
    for (var k in map){
      if (!map[k].cut && map[k].score < min) min = map[k].score;
    }
    return min === 999 ? 0 : min;
  }

  function escapeHtml(s){
    return String(s||'').replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});
  }

  function render(rows, espnStatus){
    var html = '<table><thead><tr><th class="rank">#</th><th>Entry</th><th class="score">Total</th></tr></thead><tbody>';
    for (var i=0;i<rows.length;i++){
      var r = rows[i];
      var cls = '';
      if (i===0) cls='top1'; else if (i===1) cls='top2'; else if (i===2) cls='top3';
      html += '<tr class="'+cls+'">';
      html += '<td class="rank">'+(i+1)+'</td>';
      html += '<td><div class="name">'+escapeHtml(r.name)+'</div>';
      html += '<div class="picks">';
      var bits = [];
      for (var k=0;k<r.detail.length;k++){
        var d = r.detail[k];
        var c = d.cut ? ' class="cut"' : '';
        bits.push('<span'+c+'>'+escapeHtml(d.name)+' '+fmt(d.score)+'</span>');
      }
      html += bits.join(' · ');
      html += '</div>';
      if (r.tiebreaker) html += '<div class="tb">Tiebreaker guess: '+fmt(r.tiebreaker)+'</div>';
      html += '</td>';
      html += '<td class="score '+scoreClass(r.total)+'">'+fmt(r.total)+'</td>';
      html += '</tr>';
    }
    html += '</tbody></table>';
    tableEl.innerHTML = html;
    var now = new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
    statusEl.className = 'ok';
    statusEl.textContent = 'LIVE · '+espnStatus+' · '+rows.length+' entries · Updated '+now;
  }

  function refresh(){
    statusEl.className = '';
    statusEl.textContent = 'Refreshing...';
    Promise.all([
      fetch(ESPN_URL,{cache:'no-store'}).then(function(r){return r.json();}),
      fetch(PICKS_CSV+'&cb='+Date.now(),{cache:'no-store'}).then(function(r){return r.text();})
    ]).then(function(results){
      var espn = results[0];
      var csv = results[1];
      var scoreMap = buildScoreMap(espn);
      var leaderScore = leaderScoreFromMap(scoreMap);
      var espnStatus = 'Live';
      try { espnStatus = espn.events[0].status.type.description; } catch(e){}

      var csvRows = parseCSV(csv);
      // Columns: 0=Timestamp 1=Name 2=Email 3=Phone 4-11=Pick1..Pick8 12=Tiebreaker 13=PIN 14=Status 15=EnteredByAdmin
      var entries = [];
      for (var i=0;i<csvRows.length;i++){
        var row = csvRows[i];
        if (!row || row.length < 13) continue;
        var name = row[1];
        if (!name || /^name$/i.test(name)) continue; // skip header if any
        var picks = [row[4],row[5],row[6],row[7],row[8],row[9],row[10],row[11]];
        var tb = parseInt(row[12],10);
        if (isNaN(tb)) tb = 0;
        entries.push({name:name,picks:picks,tiebreaker:tb});
      }

      var rows = [];
      for (var ei=0; ei<entries.length; ei++){
        var e = entries[ei];
        var total = 0;
        var detail = [];
        for (var pi=0; pi<e.picks.length; pi++){
          var key = normName(e.picks[pi]);
          var info = scoreMap[key];
          if (info){
            total += info.score;
            detail.push({name:info.name,score:info.score,cut:info.cut});
          } else if (e.picks[pi]){
            // Player not in ESPN field at all
            total += NOSHOW_PENALTY;
            detail.push({name:e.picks[pi],score:NOSHOW_PENALTY,cut:true});
          }
        }
        rows.push({name:e.name,total:total,detail:detail,tiebreaker:e.tiebreaker});
      }

      rows.sort(function(a,b){
        if (a.total !== b.total) return a.total - b.total;
        var aD = Math.abs((a.tiebreaker||0) - leaderScore);
        var bD = Math.abs((b.tiebreaker||0) - leaderScore);
        return aD - bD;
      });

      render(rows, espnStatus);
    }).catch(function(err){
      console.error(err);
      statusEl.className = 'err';
      statusEl.textContent = 'Fetch failed: ' + String(err) + ' · Retrying in 90s';
    });
  }

  refresh();
  setInterval(refresh, REFRESH_MS);
})();
</script>
</body>
</html>
