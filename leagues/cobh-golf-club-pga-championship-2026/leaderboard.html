<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0a">
  <title>Leaderboard · Cobh Golf Club — PGA Championship 2026 | SnipeGolf</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .sg-status{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);font-size:.82rem;color:var(--muted)}
    .sg-status.ok{background:rgba(46,204,113,.12);border-color:rgba(46,204,113,.3);color:#7be2a7}
    .sg-status.err{background:rgba(231,76,60,.12);border-color:rgba(231,76,60,.3);color:#f7a5a0}
    .sg-dot{width:8px;height:8px;border-radius:50%;background:#7be2a7;box-shadow:0 0 0 0 rgba(123,226,167,.6);animation:sgpulse 1.8s infinite}
    @keyframes sgpulse{0%{box-shadow:0 0 0 0 rgba(123,226,167,.6)}70%{box-shadow:0 0 0 8px rgba(123,226,167,0)}100%{box-shadow:0 0 0 0 rgba(123,226,167,0)}}
    .refresh-bar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:var(--s-4);flex-wrap:wrap}

    .lb-card{padding:0;overflow:hidden}
    .lb-row{display:grid;grid-template-columns:48px 1fr 80px;gap:12px;padding:14px 16px;border-bottom:1px solid rgba(255,255,255,.06);align-items:center;transition:background .15s}
    .lb-row:last-child{border-bottom:none}
    .lb-row:hover{background:rgba(255,255,255,.03)}
    .lb-row.top1{background:linear-gradient(90deg,rgba(212,175,55,.10),transparent)}
    .lb-row.top2{background:linear-gradient(90deg,rgba(192,192,192,.08),transparent)}
    .lb-row.top3{background:linear-gradient(90deg,rgba(205,127,50,.10),transparent)}

    .rank{font-weight:800;font-size:1rem;color:var(--muted);text-align:center}
    .rank.medal{width:32px;height:32px;border-radius:50%;line-height:32px;margin:0 auto;color:#1a1a1a;font-size:.85rem}
    .rank.m1{background:#d4af37}
    .rank.m2{background:#c0c0c0}
    .rank.m3{background:#cd7f32}

    .entry-name{font-weight:700;font-size:1rem;color:var(--text);margin-bottom:8px;font-family:'Fraunces',Georgia,serif}
    .bracket-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
    .bracket{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06);border-radius:8px;padding:6px 8px;min-width:0}
    .bracket-label{font-size:.62rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;margin-bottom:4px;opacity:.7}
    .bracket-pick{font-size:.78rem;line-height:1.4;display:flex;justify-content:space-between;gap:6px;color:var(--text)}
    .bracket-pick.cut .pname{color:#888;text-decoration:line-through}
    .bracket-pick.cut .pscore{color:#888}
    .pname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .pscore{font-variant-numeric:tabular-nums;font-weight:600;flex-shrink:0}
    .pscore.neg{color:#7be2a7}
    .pscore.pos{color:#f7a5a0}
    .pscore.even{color:var(--muted)}

    .total{text-align:right;font-size:1.4rem;font-weight:800;font-variant-numeric:tabular-nums;font-family:'Manrope',sans-serif}
    .total.neg{color:#7be2a7}
    .total.pos{color:#f7a5a0}
    .total.even{color:var(--text)}

    .tb-line{font-size:.7rem;color:#6c7787;margin-top:8px;font-weight:500}
    .sg-empty{padding:48px 20px;text-align:center;color:var(--muted)}

    @media(max-width:720px){
      .bracket-grid{grid-template-columns:repeat(2,1fr)}
    }
    @media(max-width:480px){
      .lb-row{grid-template-columns:36px 1fr 64px;gap:8px;padding:12px 10px}
      .rank.medal{width:26px;height:26px;line-height:26px;font-size:.72rem}
      .total{font-size:1.15rem}
      .entry-name{font-size:.95rem}
      .bracket-pick{font-size:.72rem}
    }
  </style>
</head>
<body data-page="leaderboard">

  <header class="site-header" role="banner">
    <div class="site-header__inner">
      <a class="brand" href="../../index.html" aria-label="SnipeGolf home">
        <span class="brand__mark" aria-hidden="true">S</span>
        <span class="serif">SNIPEGOLF</span>
      </a>
      <nav class="site-nav" aria-label="Primary">
        <a href="pga-scores.html">PGA live scores</a>
      </nav>
    </div>
  </header>

  <div class="league-header">
    <div class="league-header__row">
      <div class="league-logos">
        <img src="https://res.cloudinary.com/pgatour-prod/d_tournaments:logos:r000.png/tournaments/logos/r033.png" alt="Cobh Golf Club" onerror="this.style.display='none'">
      </div>
      <div class="league-title">
        <span>PGA Championship 2026</span>
        <small>Cobh Golf Club · Aronimink · Par 70</small>
      </div>
    </div>
  </div>

  <main>
    <section class="section">
      <div class="container">

        <nav class="tab-nav" aria-label="League sections">
          <a href="index.html">Home</a>
          <a href="leaderboard.html" class="active">Leaderboard</a>
          <a href="https://script.google.com/macros/s/AKfycbzf26drG5RAVZTBIOVzOJbK7yyNOHZvvi6iaTOq0lre50coQR5sCztY3xBDj4CQDJl9mw/exec?league=cobh-golf-club-pga-championship-2026&amp;mode=picks">Enter picks</a>
          <a href="field.html">Field</a>
          <a href="qr.html">QR poster</a>
        </nav>

        <div class="refresh-bar">
          <h2 class="serif" style="margin:0">Leaderboard</h2>
          <span id="sg-status" class="sg-status"><span class="sg-dot"></span>Loading…</span>
        </div>

        <div class="card lb-card mb-6">
          <div id="sg-body">
            <div class="sg-empty">Loading entries…</div>
          </div>
        </div>

        <p style="font-size:.78rem;color:var(--muted);text-align:center;margin-top:var(--s-3)">
          Auto-refresh every 90 seconds · Live data from ESPN · Missed cut / WD / DQ = score at cut + 5
        </p>

      </div>
    </section>
  </main>

<script>
(function(){
  var ESPN_URL = 'https://site.api.espn.com/apis/site/v2/sports/golf/leaderboard?event=401811947';
  var PICKS_CSV = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSspURQcmIsWDqRciouecPQ61cQXED09XszJopzbyyNmgBxojHAMxwr-tzfeFVj-ZuRKKx1RyACe_PZ/pub?gid=922314092&single=true&output=csv';
  var BRACKET_URLS = [
    'https://docs.google.com/spreadsheets/d/e/2PACX-1vSspURQcmIsWDqRciouecPQ61cQXED09XszJopzbyyNmgBxojHAMxwr-tzfeFVj-ZuRKKx1RyACe_PZ/pub?gid=955254154&single=true&output=csv',
    'https://docs.google.com/spreadsheets/d/e/2PACX-1vSspURQcmIsWDqRciouecPQ61cQXED09XszJopzbyyNmgBxojHAMxwr-tzfeFVj-ZuRKKx1RyACe_PZ/pub?gid=1968252990&single=true&output=csv',
    'https://docs.google.com/spreadsheets/d/e/2PACX-1vSspURQcmIsWDqRciouecPQ61cQXED09XszJopzbyyNmgBxojHAMxwr-tzfeFVj-ZuRKKx1RyACe_PZ/pub?gid=450545863&single=true&output=csv',
    'https://docs.google.com/spreadsheets/d/e/2PACX-1vSspURQcmIsWDqRciouecPQ61cQXED09XszJopzbyyNmgBxojHAMxwr-tzfeFVj-ZuRKKx1RyACe_PZ/pub?gid=329158296&single=true&output=csv'
  ];
  var REFRESH_MS = 60 * 1000;

  var MC = 5, WD = 5, DQ = 5, NOSHOW = 5;

  var NAME_ALIASES = {
    'matthew fitzpatrick': 'matt fitzpatrick',
    'daniel brown': 'dan brown'
  };

  var statusEl = document.getElementById('sg-status');
  var bodyEl = document.getElementById('sg-body');
  var bracketMap = {}; // normName -> bracketNumber (1-4)

  function normName(n){
    var s = String(n||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
    if (NAME_ALIASES[s]) return NAME_ALIASES[s];
    return s;
  }
  function fmt(s){ if (s===null||s===undefined) return '—'; if (s===0) return 'E'; if (s>0) return '+'+s; return String(s); }
  function scoreClass(s){ if (s===0) return 'even'; if (s<0) return 'neg'; return 'pos'; }
  function escapeHtml(s){ return String(s||'').replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }

  function parseCSV(text){
    var rows=[], cur='', row=[], inQ=false;
    for (var i=0;i<text.length;i++){
      var c=text[i];
      if (inQ){
        if (c==='"' && text[i+1]==='"'){ cur+='"'; i++; }
        else if (c==='"'){ inQ=false; }
        else cur+=c;
      } else {
        if (c==='"') inQ=true;
        else if (c===','){ row.push(cur); cur=''; }
        else if (c==='\n'){ row.push(cur); rows.push(row); row=[]; cur=''; }
        else if (c==='\r'){} else cur+=c;
      }
    }
    if (cur.length||row.length){ row.push(cur); rows.push(row); }
    return rows;
  }

  function buildScoreMap(espn){
    var map={};
    try {
      var competitors=espn.events[0].competitions[0].competitors||[];
      for (var i=0;i<competitors.length;i++){
        var p=competitors[i];
        var name=p.athlete?p.athlete.displayName:'';
        if (!name) continue;
        var status=(p.status&&p.status.type&&p.status.type.name)||'';
        var statusDesc=(p.status&&p.status.type&&p.status.type.description)||'';
        var sLower=(status+' '+statusDesc).toLowerCase();
        var sv=null;
        if (p.statistics){
          for (var j=0;j<p.statistics.length;j++){
            var nm=p.statistics[j].name;
            if (nm==='scoreToPar'||nm==='toPar'){ sv=parseInt(p.statistics[j].value,10); break; }
          }
        }
        if (sv===null && p.score!==undefined){
          var raw=String(p.score).trim().replace('E','0').replace('+','');
          var n=parseInt(raw,10);
          if (!isNaN(n)) sv=n;
        }
        var cut=false;
        var base=sv!==null?sv:0;
        if (sLower.indexOf('cut')>=0){ sv=base+MC; cut=true; }
        else if (sLower.indexOf('withdraw')>=0||sLower.indexOf(' wd')>=0||sLower==='wd'){ sv=base+WD; cut=true; }
        else if (sLower.indexOf('disqual')>=0||sLower==='dq'){ sv=base+DQ; cut=true; }
        map[normName(name)]={name:name,score:sv!==null?sv:0,cut:cut};
      }
    } catch(e){ console.error('ESPN parse',e); }
    return map;
  }

  function leaderScore(map){
    var min=999;
    for (var k in map){ if (!map[k].cut && map[k].score<min) min=map[k].score; }
    return min===999?0:min;
  }

  function setStatus(msg, cls){
    statusEl.className = 'sg-status ' + (cls||'');
    statusEl.innerHTML = (cls==='ok' ? '<span class="sg-dot"></span>' : '') + escapeHtml(msg);
  }

  function loadBrackets(){
    var promises = BRACKET_URLS.map(function(u){ return fetch(u+'&cb='+Date.now(),{cache:'no-store'}).then(function(r){return r.text();}); });
    return Promise.all(promises).then(function(texts){
      for (var b=0;b<texts.length;b++){
        var rows=parseCSV(texts[b]);
        for (var i=0;i<rows.length;i++){
          var nm=rows[i][0];
          if (!nm || /^playername$/i.test(nm)) continue;
          bracketMap[normName(nm)] = b+1;
        }
      }
    });
  }

  function bracketOf(pickName){
    return bracketMap[normName(pickName)] || 0;
  }

  function render(rows, espnStatus){
    if (!rows.length){
      bodyEl.innerHTML = '<div class="sg-empty">No entries yet.</div>';
      return;
    }
    var html='';
    for (var i=0;i<rows.length;i++){
      var r=rows[i];
      var cls=''; if(i===0)cls='top1'; else if(i===1)cls='top2'; else if(i===2)cls='top3';
      var rankCell;
      if (i===0) rankCell='<div class="rank medal m1">1</div>';
      else if (i===1) rankCell='<div class="rank medal m2">2</div>';
      else if (i===2) rankCell='<div class="rank medal m3">3</div>';
      else rankCell='<div class="rank">'+(i+1)+'</div>';

      // Group picks by bracket 1-4
      var groups=[[],[],[],[]];
      var orphans=[];
      for (var k=0;k<r.detail.length;k++){
        var d=r.detail[k];
        var b=d.bracket;
        if (b>=1 && b<=4) groups[b-1].push(d);
        else orphans.push(d);
      }
      // Distribute orphans evenly into bracket slots (paired logic — 2 per bracket)
      var slotIdx=0;
      for (var bi=0;bi<4 && orphans.length;bi++){
        while (groups[bi].length < 2 && orphans.length){
          groups[bi].push(orphans.shift());
        }
      }

      var bracketHtml='<div class="bracket-grid">';
      for (var bi=0; bi<4; bi++){
        bracketHtml += '<div class="bracket"><div class="bracket-label">Bracket '+(bi+1)+'</div>';
        for (var pi=0; pi<groups[bi].length; pi++){
          var d=groups[bi][pi];
          var cutCls = d.cut ? ' cut' : '';
          bracketHtml += '<div class="bracket-pick'+cutCls+'"><span class="pname" title="'+escapeHtml(d.name)+'">'+escapeHtml(d.name)+'</span><span class="pscore '+scoreClass(d.score)+'">'+fmt(d.score)+'</span></div>';
        }
        if (!groups[bi].length){
          bracketHtml += '<div class="bracket-pick" style="opacity:.4"><span class="pname">—</span></div>';
        }
        bracketHtml += '</div>';
      }
      bracketHtml += '</div>';

      html += '<div class="lb-row '+cls+'">';
      html += rankCell;
      html += '<div><div class="entry-name">'+escapeHtml(r.name)+'</div>'+bracketHtml;
      if (r.tiebreaker) html += '<div class="tb-line">Tiebreaker guess: '+fmt(r.tiebreaker)+'</div>';
      html += '</div>';
      html += '<div class="total '+scoreClass(r.total)+'">'+fmt(r.total)+'</div>';
      html += '</div>';
    }
    bodyEl.innerHTML = html;
    var now = new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
    setStatus('Live · '+espnStatus+' · '+rows.length+' entries · '+now, 'ok');
  }

  function refresh(){
    setStatus('Refreshing…','');
    Promise.all([
      fetch(ESPN_URL,{cache:'no-store'}).then(function(r){return r.json();}),
      fetch(PICKS_CSV+'&cb='+Date.now(),{cache:'no-store'}).then(function(r){return r.text();})
    ]).then(function(results){
      var espn=results[0], csv=results[1];
      var scoreMap=buildScoreMap(espn);
      var lead=leaderScore(scoreMap);
      var espnStatus='Live';
      try { espnStatus=espn.events[0].status.type.description; } catch(e){}

      var csvRows=parseCSV(csv);
      var entries=[];
      for (var i=0;i<csvRows.length;i++){
        var row=csvRows[i];
        if (!row||row.length<13) continue;
        var name=row[1];
        if (!name||/^name$/i.test(name)) continue;
        // CSV cols 4..11 are picks; spreadsheet order = B1P1, B1P2, B2P1, B2P2, B3P1, B3P2, B4P1, B4P2
        var picks=[
          {n:row[4], b:1}, {n:row[5], b:1},
          {n:row[6], b:2}, {n:row[7], b:2},
          {n:row[8], b:3}, {n:row[9], b:3},
          {n:row[10], b:4}, {n:row[11], b:4}
        ];
        var tb=parseInt(row[12],10); if (isNaN(tb)) tb=0;
        entries.push({name:name,picks:picks,tiebreaker:tb});
      }

      var rows=[];
      for (var ei=0;ei<entries.length;ei++){
        var e=entries[ei];
        var total=0, detail=[];
        for (var pi=0;pi<e.picks.length;pi++){
          var pk=e.picks[pi];
          if (!pk.n) continue;
          var key=normName(pk.n);
          var info=scoreMap[key];
          // Bracket from ESPN/sheet lookup overrides slot-position bracket; fallback to slot
          var b = bracketOf(pk.n) || pk.b;
          if (info){
            total+=info.score;
            detail.push({name:info.name,score:info.score,cut:info.cut,bracket:b});
          } else {
            total+=NOSHOW;
            detail.push({name:pk.n,score:NOSHOW,cut:true,bracket:b});
          }
        }
        rows.push({name:e.name,total:total,detail:detail,tiebreaker:e.tiebreaker});
      }

      rows.sort(function(a,b){
        if (a.total!==b.total) return a.total-b.total;
        return Math.abs((a.tiebreaker||0)-lead) - Math.abs((b.tiebreaker||0)-lead);
      });

      render(rows,espnStatus);
    }).catch(function(err){
      console.error(err);
      setStatus('Fetch failed — retrying in 90s','err');
    });
  }

  // Load brackets once, then start refresh loop
  loadBrackets().then(function(){
    refresh();
    setInterval(refresh,REFRESH_MS);
  }).catch(function(e){
    console.warn('Bracket lookup failed, using slot-position fallback',e);
    refresh();
    setInterval(refresh,REFRESH_MS);
  });
})();
</script>
</body>
</html>
