<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<title>PGA live scores — Cobh Golf Club | SnipeGolf</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  .scores-wrap{max-width:980px;margin:0 auto;padding:20px 16px}
  .scores-meta{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0 22px;align-items:center}
  .scores-meta .pill{background:rgba(255,255,255,.06);color:#cfd6e4;padding:6px 12px;border-radius:999px;font-size:13px;border:1px solid rgba(255,255,255,.08)}
  .scores-meta .live{background:rgba(0,255,135,.1);color:#00ff87;border-color:rgba(0,255,135,.3)}
  .scores-table{width:100%;border-collapse:collapse;background:rgba(255,255,255,.02);border-radius:12px;overflow:hidden}
  .scores-table th,.scores-table td{padding:10px 12px;text-align:left;border-bottom:1px solid rgba(255,255,255,.06);font-size:14px;color:#e6ecf5}
  .scores-table th{background:rgba(255,255,255,.04);font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:#8a8f8c;font-weight:600}
  .scores-table td.right{text-align:right;font-variant-numeric:tabular-nums}
  .scores-table .pos{width:48px;color:#8a8f8c}
  .scores-table .score-red{color:#ff5a6b;font-weight:600}
  .scores-table .score-green{color:#00ff87;font-weight:600}
  .scores-cut td{font-style:italic;color:#8a8f8c}
  .scores-empty{padding:48px 24px;text-align:center;color:#8a8f8c;background:rgba(255,255,255,.02);border-radius:12px;border:1px solid rgba(255,255,255,.06)}
  .scores-empty h2{font-family:Fraunces,Georgia,serif;color:#e6ecf5;margin:0 0 8px;font-size:1.4rem}
  .scores-empty p{margin:4px 0;color:#cfd6e4}
  .scores-empty .firsttee{margin-top:14px;color:#00ff87;font-weight:600}
  .refresh-note{text-align:right;font-size:12px;color:#8a8f8c;margin-top:12px}
  .back-strip{padding:14px 16px;border-bottom:1px solid rgba(255,255,255,.06)}
  .back-link{color:#00ff87;text-decoration:none;font-size:.9rem}
</style>
</head>
<body>
<header class="site-header">
  <div class="site-header__inner">
    <a class="brand" href="index.html" aria-label="SnipeGolf home">
      <span class="brand__mark">S</span><span class="serif">SNIPEGOLF</span>
    </a>
    <nav class="site-nav">
      <a href="index.html">Home</a>
      <a href="leaderboard.html">Leaderboard</a>
      <a href="field.html">Field</a>
    </nav>
  </div>
</header>
<div class="back-strip"><a href="leaderboard.html" class="back-link">← Back to Cobh Golf Club leaderboard</a></div>
<main>
<div class="scores-wrap">
  <h1 class="serif" style="font-family:Fraunces,Georgia,serif;color:#e6ecf5;margin:8px 0 4px;font-size:clamp(1.6rem,4vw,2.2rem)">PGA Championship 2026</h1>
  <div class="scores-meta">
    <span class="pill" id="meta-status">Loading…</span>
    <span class="pill" id="meta-round"></span>
    <span class="pill" id="meta-cut"></span>
  </div>
  <div id="scores-content">
    <div class="scores-empty"><h2>Loading…</h2><p>Fetching live scores from ESPN.</p></div>
  </div>
  <p class="refresh-note">Auto-refresh 60s · source: ESPN</p>
</div>
</main>
<footer class="site-footer">
  <div class="container" style="padding:18px 16px;text-align:center;color:#8a8f8c;font-size:.82rem">
    ⛳ SnipeGolf · Cobh Golf Club
  </div>
</footer>
<script>
(function(){
  var EVENT_ID = "401811947";
  var URL = "https://site.api.espn.com/apis/site/v2/sports/golf/leaderboard?event=" + EVENT_ID;
  function $(id){return document.getElementById(id)}
  function fmt(v){var n=Number(v);if(isNaN(n))return v||"";if(n===0)return "E";return n>0?"+"+n:""+n}
  function pad(n){return n<10?"0"+n:n}
  function load(){
    fetch(URL).then(function(r){return r.json()}).then(function(j){
      var ev = j && j.events && j.events[0];
      var comp = ev && ev.competitions && ev.competitions[0];
      var status = ev && ev.status && ev.status.type;
      var state = status && status.state || "pre";
      var statusName = status && (status.shortDetail || status.description) || "Scheduled";
      var firstTee = ev && ev.date;
      $("meta-status").textContent = statusName;
      if(state==="in"){$("meta-status").className="pill live"}
      if(state==="pre"){
        var d = firstTee?new Date(firstTee):null;
        var when = d?d.toLocaleString("en-IE",{weekday:"long",month:"long",day:"numeric",hour:"numeric",minute:"2-digit"}):"TBA";
        $("scores-content").innerHTML =
          '<div class="scores-empty">'+
          '<h2>Tournament not started</h2>'+
          '<p>Live scores will appear here once Round 1 begins.</p>'+
          '<p class="firsttee">First tee: '+when+'</p>'+
          '<p style="margin-top:18px"><a href="field.html" class="btn btn--ghost">View field &amp; brackets &rarr;</a></p>'+
          '</div>';
        return;
      }
      var competitors = (comp && comp.competitors) || [];
      if(!competitors.length){
        $("scores-content").innerHTML = '<div class="scores-empty"><h2>No scores yet</h2></div>';return;
      }
      competitors.sort(function(a,b){return (a.status&&a.status.position&&a.status.position.id||999)-(b.status&&b.status.position&&b.status.position.id||999)});
      var rows = competitors.slice(0,80).map(function(c){
        var ath = c.athlete||{};
        var nm = ath.displayName||"";
        var pos = c.status&&c.status.position&&c.status.position.displayName||"";
        var tot = c.statistics && (c.statistics.find(function(s){return s.name==="scoreToPar"})||{}).displayValue;
        var thru = c.status&&c.status.thru||"";
        var today = c.linescores && c.linescores.length && c.linescores[c.linescores.length-1].value;
        var tot2 = tot||fmt(c.score);
        var cls = tot2 && tot2.charAt(0)==="-"?"score-red":(tot2 && tot2.charAt(0)==="+"?"":"score-green");
        return '<tr><td class="pos">'+pos+'</td><td>'+nm+'</td><td class="right '+cls+'">'+(tot2||"E")+'</td><td class="right">'+(thru||"—")+'</td><td class="right">'+(today!=null?fmt(today):"—")+'</td></tr>';
      }).join("");
      $("scores-content").innerHTML = '<table class="scores-table"><thead><tr><th>POS</th><th>PLAYER</th><th class="right">TOTAL</th><th class="right">THRU</th><th class="right">TODAY</th></tr></thead><tbody>'+rows+'</tbody></table>';
    }).catch(function(e){
      $("scores-content").innerHTML = '<div class="scores-empty"><h2>Could not load scores</h2><p>'+(e&&e.message||e)+'</p></div>';
    });
  }
  load(); setInterval(load,60000);
})();
</script>
</body>
</html>
