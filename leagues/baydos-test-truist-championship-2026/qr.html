<!DOCTYPE html>
<!--
  SnipeGolf — QR poster page
  Tournament name loaded from Config sheet via app.js loadConfig().
  Static fallback set below.
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0a">
  <title>QR Poster — Truist Championship 2026 | SnipeGolf</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="qr">

  <header class="site-header" role="banner">
    <div class="site-header__inner">
      <a class="brand" href="../../index.html" aria-label="SnipeGolf home">
        <span class="brand__mark" aria-hidden="true">S</span>
        <span class="serif">SNIPEGOLF</span>
      </a>
      <nav class="site-nav" aria-label="Primary">
        <a href="leaderboard.html">Leaderboard</a>
      </nav>
    </div>
  </header>

  <div class="league-header">
    <div class="league-header__row">
      <div class="league-title">
        <span data-tournament>Truist Championship 2026</span>
        <small data-club-name>Baydos Test</small>
      </div>
    </div>
  </div>

  <main>
    <section class="section">
      <div class="container container-narrow">
        <nav class="tab-nav" aria-label="League sections">
          <a href="index.html">Home</a>
          <a href="leaderboard.html">Leaderboard</a>
          <a href="picks.html">Enter picks</a>
          <a href="qr.html" class="active">QR poster</a>
        </nav>

        <header class="mb-6">
          <span class="eyebrow">QR Poster</span>
          <h1 style="margin-top:8px">Scan to enter picks</h1>
          <p class="lead">Print this page or display on screen so your members can scan and enter their picks.</p>
        </header>

        <div class="card" style="text-align:center;padding:var(--s-6)">
          <div id="qr-target"
               data-url="https://snipegolf.github.io/snipegolf/leagues/baydos-test-truist-championship-2026/picks.html"
               style="margin:0 auto var(--s-4);width:fit-content">
          </div>
          <p id="qr-url-label" style="font-size:.8rem;color:var(--muted);word-break:break-all;margin-top:var(--s-3)"></p>
          <p class="lead mt-4" data-tournament>Truist Championship 2026</p>
          <p data-club-name>Baydos Test</p>
          <button class="btn btn--ghost btn--sm mt-4" onclick="window.print()">Print poster</button>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <div class="site-footer__bottom" style="border:none;padding-top:0">
        <span>Baydos Test</span>
        <span><a href="terms.html">Terms</a> &middot; <a href="privacy.html">Privacy</a> &middot; 18+</span>
      </div>
    </div>
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="js/themes.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
