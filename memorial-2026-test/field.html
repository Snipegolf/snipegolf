<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<title>Field · SnipeGolf</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/style.css">
</head>
<body data-page="field">

<div id="sg-header"></div>

<main>
  <section class="section">
    <div class="container">
      <div id="sg-tabs"></div>

      <div class="refresh-bar">
        <h2 class="serif" style="margin:0">Tournament field</h2>
        <span id="sg-status" class="sg-status"><span class="sg-dot"></span>Loading…</span>
      </div>

      <div class="stat-block">
        <div class="stat"><span class="v" id="stat-players">—</span><span class="l">Players</span></div>
        <div class="stat"><span class="v" id="stat-leader">—</span><span class="l">Leader</span></div>
        <div class="stat"><span class="v" id="stat-cut">—</span><span class="l">Cut line</span></div>
        <div class="stat"><span class="v" id="stat-round">—</span><span class="l">Round</span></div>
      </div>

      <div class="field-filter">
        <input type="search" id="field-search" placeholder="Search player…" aria-label="Search">
        <select id="field-bracket" aria-label="Bracket filter">
          <option value="">All brackets</option>
          <option value="A">Bracket A</option>
          <option value="B">Bracket B</option>
          <option value="C">Bracket C</option>
          <option value="D">Bracket D</option>
        </select>
        <select id="field-cut" aria-label="Cut filter">
          <option value="all">All players</option>
          <option value="active">Active only</option>
          <option value="cut">Missed cut</option>
        </select>
      </div>

      <div class="lb-wrap card">
        <table class="lb field-table">
          <thead>
            <tr>
              <th class="col-rank">#</th>
              <th>Player</th>
              <th class="hide-sm">Bracket</th>
              <th>Total</th>
              <th class="hide-xs">Thru</th>
              <th class="hide-xs">Today</th>
              <th class="hide-sm">R1</th>
              <th class="hide-sm">R2</th>
              <th class="hide-sm">R3</th>
              <th class="hide-sm">R4</th>
            </tr>
          </thead>
          <tbody id="field-body">
            <tr><td colspan="10" class="sg-empty">Loading…</td></tr>
          </tbody>
        </table>
      </div>

      <p style="font-size:.78rem;color:var(--muted);text-align:center;margin-top:var(--s-3)">
        Source: ESPN · Auto-refresh every 2 minutes · CUT/WD/DQ rows shown with strikethrough
      </p>
    </div>
  </section>
</main>

<script src="../shared/themes.js"></script>
<script src="../shared/sg-nav.js"></script>
<script>
(function () {
  var WORKER = 'https://twilight-recipe-e213.badenmaher.workers.dev';
  var REFRESH_MS = 120 * 1000;
  var allPlayers = [];
  var bracketMap = {};

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]; }); }
  function normName(s) {
    if (!s) return '';
    return String(s).toLowerCase()
      .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
      .replace(/[^a-z0-9]/g, '');
  }
  function fmt(n) { if (n == null || n === '') return '—'; var v = parseInt(n, 10); if (isNaN(v)) return esc(n); if (v === 0) return 'E'; return (v>0?'+':'') + v; }
  function scoreClass(n) { if (n == null) return ''; var v = parseInt(n,10); if (isNaN(v)) return ''; if (v < 0) return 'under'; if (v > 0) return 'over'; return ''; }
  function isCut(p) { return p.status && /CUT|MDF|WD|DQ|MC/i.test(p.status); }

  SGNav.init({ active: 'field' }).then(function (d) {
    if (!d || !d.ok) return;
    var slug = d.league.league_slug;
    var compSlug = d.comp.comp_slug;
    document.title = d.comp.name + ' — Field · SnipeGolf';
    loadBrackets(slug, compSlug).then(function () { loadField(slug); });
    setInterval(function () { loadField(slug); }, REFRESH_MS);
  });

  function loadBrackets(slug, compSlug) {
    return fetch(WORKER + '/api/brackets?comp=' + encodeURIComponent(compSlug))
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (!d.ok || !d.brackets) return;
        // brackets API returns either array (legacy) or {A:[...], B:[...]}
        var allBks = [];
        if (Array.isArray(d.brackets)) {
          allBks = d.brackets;
        } else if (typeof d.brackets === 'object') {
          var keys = ['A','B','C','D'];
          for (var ki = 0; ki < keys.length; ki++) {
            var arr = d.brackets[keys[ki]] || [];
            for (var ai = 0; ai < arr.length; ai++) {
              allBks.push({ player_name: arr[ai].name || arr[ai].player_name, bracket: keys[ki] });
            }
          }
        }
        for (var i = 0; i < allBks.length; i++) {
          var b = allBks[i];
          bracketMap[normName(b.player_name || '')] = b.bracket;
        }
      })
      .catch(function () {});
  }

  function loadField(slug) {
    if (!slug) {
      document.getElementById('sg-status').innerHTML = '<span class="sg-dot" style="background:var(--bad)"></span>No league';
      return;
    }
    fetch(WORKER + '/api/field?league=' + encodeURIComponent(slug))
      .then(function (r) { return r.json(); })
      .then(function (d) {
        document.getElementById('sg-status').innerHTML = '<span class="sg-dot"></span>Updated ' + new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
        if (!d.ok || !d.field) {
          document.getElementById('field-body').innerHTML = '<tr><td colspan="10" class="sg-empty">' + esc(d.error || 'No field data') + '</td></tr>';
          return;
        }
        allPlayers = d.field || [];
        document.getElementById('stat-players').textContent = allPlayers.length;
        var active = allPlayers.filter(function (p) { return !isCut(p); });
        if (active.length) {
          var leader = active[0];
          document.getElementById('stat-leader').textContent = (leader.name || '').split(' ').slice(-1)[0];
        }
        document.getElementById('stat-cut').textContent = d.cut_score != null ? fmt(d.cut_score) : '—';
        document.getElementById('stat-round').textContent = d.round || '—';
        applyFilter();
      })
      .catch(function () {
        document.getElementById('sg-status').innerHTML = '<span class="sg-dot" style="background:var(--bad)"></span>Network err';
      });
  }

  function applyFilter() {
    var q = (document.getElementById('field-search').value || '').toLowerCase().trim();
    var bf = document.getElementById('field-bracket').value;
    var cf = document.getElementById('field-cut').value;
    var rows = '';
    for (var i = 0; i < allPlayers.length; i++) {
      var p = allPlayers[i];
      var nm = (p.name || '').toLowerCase();
      var bk = bracketMap[normName(p.name || '')] || '';
      if (q && nm.indexOf(q) === -1) continue;
      if (bf && bk !== bf) continue;
      var cut = isCut(p);
      if (cf === 'active' && cut) continue;
      if (cf === 'cut' && !cut) continue;
      var medal = i === 0 ? 'medal-1' : i === 1 ? 'medal-2' : i === 2 ? 'medal-3' : '';
      var rcls = cut ? 'is-cut' : '';
      rows += '<tr class="' + rcls + '">' +
        '<td class="col-rank ' + medal + '">' + esc(p.pos || (i+1)) + '</td>' +
        '<td><strong>' + esc(p.name) + '</strong>' + (p.status && cut ? ' <span class="status-pill">' + esc(p.status) + '</span>' : '') + '</td>' +
        '<td class="hide-sm">' + (bk ? '<span class="bracket-pill bk-' + esc(bk) + '">' + esc(bk) + '</span>' : '—') + '</td>' +
        '<td class="' + medal + ' ' + scoreClass(p.total) + '"><strong>' + fmt(p.total) + '</strong></td>' +
        '<td class="hide-xs">' + esc(p.thru || '—') + '</td>' +
        '<td class="hide-xs ' + scoreClass(p.today) + '">' + fmt(p.today) + '</td>' +
        '<td class="hide-sm">' + esc(p.r1 || '—') + '</td>' +
        '<td class="hide-sm">' + esc(p.r2 || '—') + '</td>' +
        '<td class="hide-sm">' + esc(p.r3 || '—') + '</td>' +
        '<td class="hide-sm">' + esc(p.r4 || '—') + '</td>' +
        '</tr>';
    }
    document.getElementById('field-body').innerHTML = rows || '<tr><td colspan="10" class="sg-empty">No matches.</td></tr>';
  }

  document.getElementById('field-search').addEventListener('input', applyFilter);
  document.getElementById('field-bracket').addEventListener('change', applyFilter);
  document.getElementById('field-cut').addEventListener('change', applyFilter);
})();
</script>
</body>
</html>
