<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<title>Leaderboard · SnipeGolf</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/style.css">
</head>
<body data-page="leaderboard">

<div id="sg-header"></div>

<main>
  <section class="section">
    <div class="container">
      <div id="sg-tabs"></div>

      <div class="refresh-bar">
        <h2 class="serif" style="margin:0">Leaderboard</h2>
        <span id="sg-status" class="sg-status"><span class="sg-dot"></span>Loading…</span>
      </div>

      <div class="stat-block">
        <div class="stat"><span class="v" id="stat-entries">—</span><span class="l">Entries</span></div>
        <div class="stat"><span class="v" id="stat-leader">—</span><span class="l">Leader</span></div>
        <div class="stat"><span class="v" id="stat-score">—</span><span class="l">Top score</span></div>
        <div class="stat"><span class="v" id="stat-tourLeader">—</span><span class="l">Tour leader</span></div>
      </div>

      <div class="lb-wrap card">
        <table class="lb">
          <thead>
            <tr>
              <th class="col-rank">#</th>
              <th>Player</th>
              <th>Score</th>
              <th>Best Pick</th>
              <th>Worst Pick</th>
              <th class="hide-xs">Move</th>
            </tr>
          </thead>
          <tbody id="lb-body">
            <tr><td colspan="6" class="sg-empty">Loading entries…</td></tr>
          </tbody>
        </table>
      </div>

      <p style="font-size:.78rem;color:var(--muted);text-align:center;margin-top:var(--s-3)">
        Tap a row to see all picks · Auto-refresh every 90s · Missed cut / WD / DQ = score + 5 ·
        <span style="text-decoration:line-through">strikethrough</span> = cut/WD/DQ ·
        ▲/▼ = position move since last hour
      </p>
    </div>
  </section>

  <section class="sg-section" id="prizesSection" style="display:none;margin-top:1.5rem">
    <h2 style="margin:0 0 .75rem">Prizes</h2>
    <div id="prizeList" class="prize-list"></div>
  </section>
</main>

<script src="../shared/themes.js"></script>
<script src="../shared/sg-nav.js"></script>
<script>
(function () {
  var WORKER = 'https://twilight-recipe-e213.badenmaher.workers.dev';
  var REFRESH_MS = 90 * 1000;
  var leagueSlug = (function () {
    var qs = new URLSearchParams(location.search);
    if (qs.get('league')) return qs.get('league');
    var parts = location.pathname.replace(/\/$/,'').split('/');
    for (var i = parts.length - 1; i >= 0; i--) {
      if (/^[a-z0-9][a-z0-9-]+$/.test(parts[i]) && !/\.html?$/.test(parts[i]) && parts[i] !== 'snipegolf') return parts[i];
    }
    return '';
  })();

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]; }); }
  function fmt(n) { if (n == null) return '—'; if (n === 0) return 'E'; return (n>0?'+':'') + n; }
  function scoreClass(n) { if (n == null) return ''; if (n < 0) return 'under'; if (n > 0) return 'over'; return ''; }

  function isPickCut(p) {
    if (p.cut === true) return true;
    if (p.status && /CUT|MDF|WD|DQ|MC/i.test(String(p.status))) return true;
    return false;
  }

  function expandRow(tr, picks) {
    var ex = tr.nextElementSibling;
    if (ex && ex.classList.contains('lb-detail-row')) { ex.remove(); tr.classList.remove('expanded'); return; }
    var detail = document.createElement('tr');
    detail.className = 'lb-detail-row';
    var td = document.createElement('td');
    td.colSpan = tr.children.length;
    var grid = '<div class="lb-detail"><div class="lb-detail-grid picks-detail">';
    for (var i = 0; i < picks.length; i++) {
      var p = picks[i];
      var cut = isPickCut(p);
      var cutCls = cut ? 'cut' : '';
      var cutStyle = cut ? 'text-decoration:line-through;opacity:0.7' : '';
      var sCls = scoreClass(p.score);
      grid += '<div class="pick-card ' + cutCls + '">' +
        '<span class="bk">Bracket ' + esc(p.bracket) + '</span>' +
        '<span class="pn" style="' + cutStyle + '">' + esc(p.name || '—') + '</span>' +
        '<span class="ps ' + sCls + '">' + (p.score == null ? '—' : fmt(p.score)) + (p.status ? ' · ' + esc(p.status) : '') + '</span>' +
      '</div>';
    }
    grid += '</div></div>';
    td.innerHTML = grid;
    detail.appendChild(td);
    tr.parentNode.insertBefore(detail, tr.nextSibling);
    tr.classList.add('expanded');
  }

  function render(data) {
    var status = document.getElementById('sg-status');
    var body = document.getElementById('lb-body');
    if (!data.ok) {
      status.innerHTML = '<span class="sg-dot" style="background:var(--bad)"></span>' + esc(data.error || 'Error');
      body.innerHTML = '<tr><td colspan="6" class="sg-empty">' + esc(data.error || 'Could not load.') + '</td></tr>';
      return;
    }
    status.innerHTML = '<span class="sg-dot"></span>Updated ' + new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});

    var entries = data.entries || [];
    document.getElementById('stat-entries').textContent = entries.length;
    if (entries.length) {
      var lead = entries[0];
      document.getElementById('stat-leader').textContent = (lead.name || '').split(' ').slice(-1)[0];
      document.getElementById('stat-score').textContent = fmt(lead.total);
    }
    document.getElementById('stat-tourLeader').textContent = fmt(data.winner_score);

    if (!entries.length) { body.innerHTML = '<tr><td colspan="6" class="sg-empty">No entries yet.</td></tr>'; return; }
    var html = '';
    for (var i = 0; i < entries.length; i++) {
      var e = entries[i];
      var medal = e.pos === 1 ? 'medal-1' : e.pos === 2 ? 'medal-2' : e.pos === 3 ? 'medal-3' : '';
      var move = e.move_delta;
      var moveCls = move == null ? 'move-same' : move > 0 ? 'move-up' : move < 0 ? 'move-down' : 'move-same';
      var moveTxt = move == null ? '—' : (move === 0 ? '—' : Math.abs(move));
      var rowCls = '';
      if (move != null && move >= 5) rowCls = 'big-mover';
      else if (move != null && move <= -5) rowCls = 'big-faller';

      var picksDetail = e.picks || [];
      var bestPick = '', worstPick = '';
      var sorted = picksDetail.slice().filter(function (x) { return x.score != null; }).sort(function (a,b) { return a.score - b.score; });
      if (sorted.length) {
        bestPick = sorted[0].name + ' ' + fmt(sorted[0].score);
        worstPick = sorted[sorted.length-1].name + ' ' + fmt(sorted[sorted.length-1].score);
      }

      var allCut = picksDetail.length > 0 && picksDetail.every(function (p) { return isPickCut(p); });
      var isCutRow = allCut;

      html += '<tr class="expandable ' + rowCls + (isCutRow ? ' is-cut' : '') + '" data-picks=\'' + esc(JSON.stringify(picksDetail)) + '\'>' +
        '<td class="col-rank ' + medal + '">' + e.pos + '</td>' +
        '<td class="col-name"><strong>' + esc(e.name) + '</strong></td>' +
        '<td class="col-score ' + medal + ' ' + scoreClass(e.total) + '">' + fmt(e.total) + '</td>' +
        '<td class="best-pick">' + esc(bestPick) + '</td>' +
        '<td class="worst-pick">' + esc(worstPick) + '</td>' +
        '<td class="hide-xs ' + moveCls + '">' + esc(moveTxt) + '</td>' +
        '</tr>';
    }
    body.innerHTML = html;

    var rows = body.querySelectorAll('tr.expandable');
    for (var r = 0; r < rows.length; r++) {
      (function (tr) {
        tr.addEventListener('click', function () {
          var p;
          try { p = JSON.parse(tr.getAttribute('data-picks') || '[]'); } catch (e) { p = []; }
          expandRow(tr, p);
        });
      })(rows[r]);
    }
  }

  function load() {
    if (!leagueSlug) {
      document.getElementById('sg-status').innerHTML = '<span class="sg-dot" style="background:var(--bad)"></span>No league';
      return;
    }
    fetch(WORKER + '/api/prizes?league=' + encodeURIComponent(leagueSlug))
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (d && d.ok && d.prizes && d.prizes.length) {
          var html = '';
          for (var i = 0; i < d.prizes.length; i++) {
            var p = d.prizes[i];
            html += '<div class="prize-row"><span class="prize-label">' + esc(p.label) + '</span><span class="prize-amount">' + esc(p.amount) + '</span></div>';
          }
          document.getElementById('prizeList').innerHTML = html;
          document.getElementById('prizesSection').style.display = 'block';
        }
      }).catch(function () {});

    fetch(WORKER + '/api/leaderboard?league=' + encodeURIComponent(leagueSlug))
      .then(function (r) { return r.json(); })
      .then(render)
      .catch(function (e) {
        document.getElementById('sg-status').innerHTML = '<span class="sg-dot" style="background:var(--bad)"></span>Network err';
      });
  }

  SGNav.init({ active: 'leaderboard' });
  load();
  setInterval(load, REFRESH_MS);
})();
</script>
</body>
</html>
