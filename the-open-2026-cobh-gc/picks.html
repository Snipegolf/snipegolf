<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<title>Enter picks · SnipeGolf</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/style.css">
</head>
<body data-page="picks">

<div id="sg-header"></div>

<main>
  <section class="section">
    <div class="container">
      <div id="sg-tabs"></div>

      <div class="card card--feature" style="text-align:center">
        <span class="eyebrow">Your picks</span>
        <h1 class="serif" id="hero-title" style="margin:12px 0">Loading…</h1>
        <p class="lead" id="hero-sub" style="margin:0"></p>
        <div id="lock-pill" class="badge" style="margin-top:12px"></div>
      </div>

      <div id="statusBox"></div>

      <form id="picksForm" style="display:none">
        <div class="bracket-grid">
          <div class="card pick-pick-card">
            <span class="eyebrow">Bracket A · Elite</span>
            <select id="bracket_a" class="picks-select" required></select>
            <select id="bracket_a2" class="picks-select picks-select-2" style="margin-top:8px;display:none" required></select>
          </div>
          <div class="card pick-pick-card">
            <span class="eyebrow">Bracket B · Contenders</span>
            <select id="bracket_b" class="picks-select" required></select>
            <select id="bracket_b2" class="picks-select picks-select-2" style="margin-top:8px;display:none" required></select>
          </div>
          <div class="card pick-pick-card">
            <span class="eyebrow">Bracket C · Dark horses</span>
            <select id="bracket_c" class="picks-select" required></select>
            <select id="bracket_c2" class="picks-select picks-select-2" style="margin-top:8px;display:none" required></select>
          </div>
          <div class="card pick-pick-card">
            <span class="eyebrow">Bracket D · Long shots</span>
            <select id="bracket_d" class="picks-select" required></select>
            <select id="bracket_d2" class="picks-select picks-select-2" style="margin-top:8px;display:none" required></select>
          </div>
        </div>

        <div class="card" style="margin-top:var(--s-3)">
          <span class="eyebrow">Tiebreaker — winner's final score vs par</span>
          <input id="tiebreaker" type="number" step="1" min="-30" max="30" required class="picks-input" placeholder="e.g. -12">
          <p style="font-size:.78rem;color:var(--muted);margin:8px 0 0">Closest UNDER the actual winning score wins ties. (Equal to actual = perfect)</p>
        </div>

        <button type="submit" id="submitBtn" class="btn btn--primary btn--lg" style="width:100%;margin-top:var(--s-4)">Save my picks</button>
      </form>

      <p style="text-align:center;font-size:.78rem;color:var(--muted);margin-top:var(--s-4)">
        You can edit your picks any time before lock.
      </p>
    </div>
  </section>
</main>

<script src="../shared/themes.js"></script>
<script src="../shared/sg-nav.js"></script>
<script>
(function () {
  var WORKER = 'https://twilight-recipe-e213.badenmaher.workers.dev';
  function api(p) { return WORKER + '/api' + p; }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]; }); }
  function setStatus(msg, kind) {
    document.getElementById('statusBox').innerHTML = '<div class="sg-status-box ' + (kind || '') + '">' + esc(msg) + '</div>';
  }

  var qs = new URLSearchParams(location.search);
  var pid = qs.get('pid'), token = qs.get('t');
  if (!pid || !token) { setStatus('Missing or invalid edit link. Contact your league admin.', 'err'); return; }

  var picksPerBracket = 2; // default; overridden from API response

  function buildOptions(sel, list) {
    sel.innerHTML = '<option value="">— Select —</option>';
    for (var j = 0; j < list.length; j++) {
      var pl = list[j];
      var opt = document.createElement('option');
      opt.value = pl.name;
      opt.textContent = pl.rank ? (pl.name + ' (#' + pl.rank + ')') : pl.name;
      sel.appendChild(opt);
    }
  }

  function showSecondSelects(show) {
    var sels = document.querySelectorAll('.picks-select-2');
    for (var i = 0; i < sels.length; i++) {
      sels[i].style.display = show ? '' : 'none';
      sels[i].required = show;
    }
  }

  SGNav.init({ active: 'picks' }).then(function (d) {
    if (!d || !d.ok) { setStatus('League not found.', 'err'); return; }
    var league = d.league, comp = d.comp;
    document.getElementById('hero-title').textContent = comp.name;
    document.getElementById('hero-sub').textContent = league.league_name;
    document.title = 'Picks \u00b7 ' + comp.name;

    if (String(comp.status) === 'frozen') {
      document.getElementById('lock-pill').textContent = 'LOCKED — frozen';
      document.getElementById('lock-pill').className = 'badge badge-cut';
      setStatus('This competition is frozen. Picks are locked.', 'err');
      return;
    }
    if (comp.picks_lock_datetime) {
      var lock = new Date(comp.picks_lock_datetime);
      if (!isNaN(lock.getTime()) && new Date() > lock) {
        document.getElementById('lock-pill').textContent = 'LOCKED';
        document.getElementById('lock-pill').className = 'badge badge-cut';
        setStatus('Picks are locked (' + comp.picks_lock_datetime + ').', 'err');
        return;
      }
      document.getElementById('lock-pill').textContent = 'Picks lock ' + comp.picks_lock_datetime;
      document.getElementById('lock-pill').className = 'badge badge-live';
    }

    return Promise.all([
      fetch(api('/brackets?comp=' + encodeURIComponent(comp.comp_slug))).then(function (r) { return r.json(); }),
      fetch(api('/mypick?league=' + encodeURIComponent(league.league_slug) + '&pid=' + encodeURIComponent(pid) + '&t=' + encodeURIComponent(token))).then(function (r) { return r.json(); })
    ]).then(function (out) {
      var b = out[0], my = out[1];
      if (!b.ok) { setStatus('Could not load field.', 'err'); return; }

      // picks_per_bracket from mypick response (99_ adds it); fall back to comp field or 2
      if (my && my.picks_per_bracket) picksPerBracket = parseInt(my.picks_per_bracket, 10) || 2;
      else if (comp.picks_per_bracket) picksPerBracket = parseInt(comp.picks_per_bracket, 10) || 2;

      showSecondSelects(picksPerBracket === 2);

      var letters = ['A','B','C','D'];
      for (var i = 0; i < letters.length; i++) {
        var L = letters[i];
        var list = (b.brackets && b.brackets[L]) || [];
        buildOptions(document.getElementById('bracket_' + L.toLowerCase()), list);
        if (picksPerBracket === 2) {
          buildOptions(document.getElementById('bracket_' + L.toLowerCase() + '2'), list);
        }
      }

      var pick = (my && my.pick) || {};
      if (pick.bracket_a) document.getElementById('bracket_a').value = pick.bracket_a;
      if (pick.bracket_b) document.getElementById('bracket_b').value = pick.bracket_b;
      if (pick.bracket_c) document.getElementById('bracket_c').value = pick.bracket_c;
      if (pick.bracket_d) document.getElementById('bracket_d').value = pick.bracket_d;
      if (picksPerBracket === 2) {
        if (pick.bracket_a2) document.getElementById('bracket_a2').value = pick.bracket_a2;
        if (pick.bracket_b2) document.getElementById('bracket_b2').value = pick.bracket_b2;
        if (pick.bracket_c2) document.getElementById('bracket_c2').value = pick.bracket_c2;
        if (pick.bracket_d2) document.getElementById('bracket_d2').value = pick.bracket_d2;
      }
      if (pick.tiebreaker !== undefined && pick.tiebreaker !== '') {
        document.getElementById('tiebreaker').value = pick.tiebreaker;
      }
      document.getElementById('picksForm').style.display = 'block';
      var pickCount = picksPerBracket === 2 ? 'two players' : 'one player';
      if (my && my.participant) {
        setStatus('Welcome, ' + my.participant.display_name + '. Pick ' + pickCount + ' from each bracket.', 'ok');
      }
    });
  }).catch(function (e) { setStatus('Network error: ' + e, 'err'); });

  document.getElementById('picksForm').addEventListener('submit', function (ev) {
    ev.preventDefault();

    // Client-side duplicate-within-bracket validation
    if (picksPerBracket === 2) {
      var letters = ['a','b','c','d'];
      for (var i = 0; i < letters.length; i++) {
        var L = letters[i];
        var v1 = document.getElementById('bracket_' + L).value.trim().toLowerCase();
        var v2 = document.getElementById('bracket_' + L + '2').value.trim().toLowerCase();
        if (v1 && v2 && v1 === v2) {
          setStatus('Bracket ' + L.toUpperCase() + ': your two picks must be different golfers.', 'err');
          return;
        }
      }
    }

    var btn = document.getElementById('submitBtn');
    btn.disabled = true; btn.textContent = 'Saving…';
    var body = {
      route: 'submitPick',
      pid: pid, t: token,
      bracket_a: document.getElementById('bracket_a').value,
      bracket_b: document.getElementById('bracket_b').value,
      bracket_c: document.getElementById('bracket_c').value,
      bracket_d: document.getElementById('bracket_d').value,
      tiebreaker: document.getElementById('tiebreaker').value
    };
    if (picksPerBracket === 2) {
      body.bracket_a2 = document.getElementById('bracket_a2').value;
      body.bracket_b2 = document.getElementById('bracket_b2').value;
      body.bracket_c2 = document.getElementById('bracket_c2').value;
      body.bracket_d2 = document.getElementById('bracket_d2').value;
    }
    fetch(api('/submitPick'), { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) })
      .then(function (r) { return r.json(); })
      .then(function (j) {
        if (j.ok) setStatus('Picks saved. You can edit until lock time.', 'ok');
        else setStatus('Save failed: ' + (j.error || j.message || 'unknown'), 'err');
        btn.disabled = false; btn.textContent = 'Save my picks';
      })
      .catch(function (e) { setStatus('Network error: ' + e, 'err'); btn.disabled = false; btn.textContent = 'Save my picks'; });
  });
})();
</script>
</body>
</html>
